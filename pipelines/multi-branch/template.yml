resources:
- name: repo
  type: git
  source:
    uri: https://github.com/concourse/examples
    branch: ((branch))

- name: golang
  type: registry-image
  source:
    repository: golang
    tag: latest

jobs:
- name: test
  plan:
  - in_parallel:
    - get: repo
      trigger: true
    - get: golang
  - task: tests
    image: golang
    file: repo/tasks/go-test.yml
    params: {MODULE: apps/golang}

- name: build
  plan:
  - in_parallel:
    - get: repo
      passed: [test]
      trigger: true
    - get: golang
  - task: build
    image: golang
    file: repo/tasks/go-build.yml
    params:
      MODULE: apps/golang
      BINARY_NAME: ascii-banner
  - task: run-binary
    image: golang
    config:
      platform: linux
      inputs:
        - name: binary
      run:
        path: sh
        args:
          - -cex
          - |
            ./binary/ascii-banner -list
            ./binary/ascii-banner concourse
            ./binary/ascii-banner plane
            ./binary/ascii-banner pilot
  # Could then upload the tgz file somewhere like S3
